<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>OMNIMOVE — Reset Password</title>
  <!-- Self-hosted fonts — no request to Google from the user's browser. -->
  <link href="vendor/fonts/login-fonts.css" rel="stylesheet"/>
  <link href="reset-password.css" rel="stylesheet"/>
</head>
<body>
  <div class="box">
    <div class="logo">OMNI<span>MOVE</span></div>
    <div class="tag" data-i18n="tagline">Smart mobility for Cassino — UNICAS 2025/2026</div>
    <div class="card">
      <div>
        <div class="title" data-i18n="title_reset">Reset your password</div>
        <div class="sub" data-i18n="note_reset">Choose a new password for your account.</div>
      </div>
      <div id="msgBox"></div>
      <form id="resetForm" onsubmit="doReset(event)">
        <div class="field">
          <label data-i18n="label_new_pass">New Password</label>
          <input id="p1" type="password" data-i18n="ph_min8" placeholder="Min 8 characters"/>
          <span class="ferr" id="e1"></span>
        </div>
        <div class="field">
          <label data-i18n="label_confirm_new_pass">Confirm Password</label>
          <input id="p2" type="password" data-i18n="ph_repeat_new" placeholder="Repeat password"/>
          <span class="ferr" id="e2"></span>
        </div>
        <div class="pwd-bar" id="pwdBar"></div>
        <ul class="pwd-rules" id="pwdRules"></ul>
        <button type="submit" id="btn" data-i18n="btn_set_pass">Set New Password</button>
      </form>
    </div>
    <div class="lang-toggle">
      <button class="lang-pill lang-pill-active" data-lang="en" onclick="setLanguage('en')">EN</button>
      <button class="lang-pill" data-lang="it" onclick="setLanguage('it')">IT</button>
    </div>
  </div>

  <script src="omnimove-i18n.js"></script>
  <script src="omnimove-password.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>

# ── OMNIMOVE Server ───────────────────────────────────────────
# Multimodal Journey Planner — port 8180
# Communicates with CASSITRACK (port 8280) via REST API ONLY

spring:
  application:
    name: omnimove
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omnimovedb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:omnimove}
    password: ${SPRING_DATASOURCE_PASSWORD}
  sql:
    init:
      mode: never
      data-locations: classpath:database/V2__init_data.sql
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
        host: ${SPRING_DATA_REDIS_HOST:localhost}
        port: ${SPRING_DATA_REDIS_PORT:6380}
        password: ${SPRING_REDIS_PASSWORD}
  h2:
    console:
      enabled: false

  # ── Mail (Gmail SMTP) ──────────────────────────────────────
  # Setup: myaccount.google.com/apppasswords → genera App Password de 16 letras
  # IntelliJ Run Config → Environment variables:
  #   MAIL_USERNAME=tucuenta@gmail.com
  #   MAIL_PASSWORD=abcdefghijklmnop   (sin espacios)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:omnimove.noreply.demo@gmail.com}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: false

server:
  port: 8180
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/omnimove}

# ── CASSITRACK API Connection ─────────────────────────────────
# OMNIMOVE calls CASSITRACK for live bus data
cassitrack:
  api:
    base-url: ${CASSITRACK_URL:http://localhost:8280/cassitrack/api/v1}
    token: ${CASSITRACK_API_TOKEN}
  netex:
    url: ${CASSITRACK_NETEX_URL:http://localhost:8280/cassitrack/api/static/netex}
  # ── Static-data change detection ────────────────────────────────
  # The NeTEx import above rebuilds everything and is expensive, so it is not
  # run on a timer. Instead a cheap endpoint (five change counters kept by
  # database triggers in CassiTrack) is polled, and the full import runs only
  # when one of the counters moves.
  #
  # version-url is left blank on purpose: the service derives it from
  # cassitrack.netex.url by swapping the last path segment (.../static/netex ->
  # .../static/version), so there is one fewer URL to keep in step across
  # environments. Set it only to point somewhere non-standard.
  static:
    version-url: ${CASSITRACK_VERSION_URL:}
    poll-interval-ms: ${CASSITRACK_POLL_INTERVAL_MS:60000}

# ── AI assistant ──────────────────────────────────────────────
# Any provider that speaks the OpenAI chat-completions dialect. Default is
# Regolo (Seeweb, Italy): EU data residency and zero data retention, which
# matters because the assistant is handed the traveller's journey history and
# their free-text questions.
#
# Switching provider is these three values and nothing else — the service was
# rewritten around the common dialect precisely so the choice stays reversible.
#   OpenAI  → https://api.openai.com/v1/chat/completions
#   Groq    → https://api.groq.com/openai/v1/chat/completions
#   local   → http://localhost:11434/v1/chat/completions   (Ollama)
#
# Leave the key empty and the assistant falls back to its canned answers rather
# than failing: see AiOrchestrationService.getFallbackResponse.
ai:
  api:
    key:   ${AI_API_KEY:}
    url:   ${AI_API_URL:https://api.regolo.ai/v1/chat/completions}
    model: ${AI_API_MODEL:mistral-small-4-119b}

# ── Weather Service ───────────────────────────────────────────
weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: https://api.openweathermap.org/data/2.5/weather
    city: Cassino
    country: IT

# ── Elerent Shared Mobility Pricing ──────────────────────────
elerent:
  bike:
    unlock: 1.00
    per-minute: 0.29
  scooter:
    unlock: 1.00          # canone fisso, addebitato all'avvio
    per-minute: 0.25      # anche mentre la corsa e' in pausa
    # Trattenuta temporanea di 5.00 EUR: non entra nel costo del viaggio
    # perche' viene restituita a fine corsa. E' dichiarata nel listino.
    deposit: 5.00
  # ── Elerent live availability (ATOM Mobility / RideAtom API) ──
  # All Sharing endpoints are POST + App-Public-Key header.
  # No key yet → mock=true serves simulated bikes around Cassino.
  api:
    base-url: ${ELERENT_API_URL:https://app.rideatom.com/openapi/v1.0/sharing}
    public-key: ${ELERENT_PUBLIC_KEY:}
    mock: ${ELERENT_API_MOCK:true}
    radius-km: 5
# ── OpenAPI ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui

# ── Logging ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    it.unicas.omnimove: INFO
    SECURITY_AUDIT: INFO

# ── H2 Embedded Database (for user management) ────────────────
# No Docker needed — H2 is embedded in the JAR

# ── JWT ───────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000    # 1 hour

# ── InfluxDB Omnimove ─────────────────────────────────────────────
influx:
  url: ${INFLUX_URL:http://localhost:8087}
  # Paste here your InfluxDB generated token:
  token: ${INFLUX_TOKEN}
  org: ${INFLUX_ORG:omnimove_org}
  bucket: ${INFLUX_BUCKET:omnimove_bucket}

# ── Google Maps API ───────────────────────────────────────────
# Richiede: Distance Matrix API abilitata su Google Cloud Console
# Set as .env variable GOOGLE_MAPS_API_KEY in IntelliJ
# Se non configurata, il sistema cade in fallback haversine

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
  # ── Sign in with Google ───────────────────────────────────────
  # OAuth 2.0 Client ID of type "Web application", from Google Cloud Console
  # → APIs & Services → Credentials. Add the app's origin to "Authorised
  # JavaScript origins" (e.g. http://localhost:8180).
  # Leave unset and the feature turns itself off: the login page does not
  # draw the button and /api/v1/auth/google answers 503.
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    certs-url: https://www.googleapis.com/oauth2/v3/certs

# ── reCAPTCHA v2 on the login form ────────────────────────────
# google.com/recaptcha/admin → register the site, type "Challenge (v2)",
# "I'm not a robot" checkbox. Add the app's domain to the allowed list.
# The switch in the admin dashboard turns the check on and off, but with no
# keys here it stays off whatever the switch says: a widget nobody can solve
# would lock every account out.
recaptcha:
  site-key:   ${RECAPTCHA_SITE_KEY:}
  secret-key: ${RECAPTCHA_SECRET_KEY:}

# ── OMNIMOVE App Config ───────────────────────────────────────
omnimove:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8180,http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}   # set to true when running behind Nginx+TLS
  mail:
    # Derived from the SMTP account rather than declared again: Gmail rejects or
    # rewrites a From it does not own, and two copies of the address drift the
    # moment one of them is edited.
    from: "OMNIMOVE <${spring.mail.username}>"
    base-url: ${APP_BASE_URL:http://localhost:8180}
  research:
    # Three-tier research lifecycle — see docs/privacy/DPIA-omnimove-cassitrack.md.
    # OFF by default: it moves personal data between tiers and deletes it, so it
    # is enabled deliberately and only after the DPIA has been signed off by the RPD.
    #
    # NOTE: while this is false, journeys are kept indefinitely, which contradicts
    # the 12-month retention stated in privacy.html § 7.
    enabled: ${RESEARCH_ENABLED:false}
    # Must be >= 32 chars, STABLE FOREVER, and never stored in the database it
    # protects. Changing it breaks the link to already-promoted rows and would
    # leave objections unhonoured.
    pseudonym-salt: ${RESEARCH_PSEUDONYM_SALT:}
    operational-retention-days: ${RESEARCH_OPERATIONAL_RETENTION_DAYS:365}
    tier2-retention-days: ${RESEARCH_TIER2_RETENTION_DAYS:3650}
    # Small-cell suppression threshold; the migration refuses anything below 5.
    k-threshold: ${RESEARCH_K_THRESHOLD:10}
  privacy:
    # Version of the informativa and cookie policy currently published.
    # Bump it whenever the text materially changes: consents recorded under an
    # older version stop counting and are asked again. Keep it in sync with the
    # "Ultimo aggiornamento" date shown in privacy.html and cookie-policy.html.
    policy-version: ${PRIVACY_POLICY_VERSION:2026-08-28}

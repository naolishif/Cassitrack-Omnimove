spring:
  application:
    name: cassitrack

  # -── Web / Static Resources ───────────────────────────────────────
  web:
    resources:
      static-locations:
        - classpath:/static/
        - classpath:/public/

  # ── PostgreSQL ────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/cassitrack}
    username: ${SPRING_DATASOURCE_USERNAME:cassitrack}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway (DB schema migrations) ────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ─────────────────────────────────────────────────────
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}

  # ── WebSocket ─────────────────────────────────────────────────
  websocket:
    stomp:
      endpoint: /ws/vehicles

  # ── H2 Console (disabled — use only locally with spring.h2.console.enabled=true) ─
  h2:
    console:
      enabled: false

# ── Server ───────────────────────────────────────────────────────
server:
  port: 8280
  # The static frontend addresses the API as /cassitrack/api/v1 (see
  # cassitrack-login.js, -session.js, -admin.js, -fleetmanager.js), so the app
  # must be mounted under /cassitrack whether it runs in Docker or from the IDE.
  # docker-compose passes SERVER_SERVLET_CONTEXT_PATH; the default keeps local
  # runs identical, mirroring omnimove-backend.
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/cassitrack}

# ── InfluxDB ──────────────────────────────────────────────────────
influx:
  url: ${INFLUX_URL:http://localhost:8086}
  token: ${INFLUX_TOKEN}
  org: ${INFLUX_ORG:unicas}
  bucket: ${INFLUX_BUCKET:vehicle_telemetry}

# ── MQTT Broker ───────────────────────────────────────────────────
mqtt:
  broker:
    # CassiTrack's own Mosquitto — a local-development convenience, not part of
    # the deployment. The server runs an independent broker it does not own, so
    # it sets MQTT_BROKER_ENABLED=false and ingests only through mqtt.obu.*.
    enabled: ${MQTT_BROKER_ENABLED:true}
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: cassitrack-backend
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
  topics:
    position: cassitrack/+/position    # + is a wildcard matching any vehicle_id
    ble: cassitrack/+/ble
  # ── OBU broker (real ESP32 feed / professor's simulate_bus.py) ────
  # Second, optional MQTT connection to the external TLS broker where the
  # ESP32/OBU units publish the COMPACT schema (id/ts/spd/hdg/occ/bat) on
  # cassitrack/obu/{id}/pos. Disabled by default: set MQTT_OBU_ENABLED=true
  # (and the URL/credentials) to activate this path.
  obu:
    enabled: ${MQTT_OBU_ENABLED:false}
    url: ${MQTT_OBU_URL:}                        # e.g. ssl://devaidalab.unicas.it:8883
    client-id: ${MQTT_OBU_CLIENT_ID:cassitrack-obu-bridge}
    username: ${MQTT_OBU_USERNAME:}
    password: ${MQTT_OBU_PASSWORD:}
    topic: ${MQTT_OBU_TOPIC:cassitrack/obu/+/pos}

# ── JWT ───────────────────────────────────────────────────────────
# ── Sessione ──────────────────────────────────────────────────────
#
# DUE DURATE, NON UNA.
#
# expiration-ms e' la vita del singolo token; session-max-ms e' quanto puo'
# durare in tutto una sessione, per quanto la si usi. Fra un rinnovo e
# l'altro il filtro rimette in circolo un token nuovo, quindi la prima si
# comporta come una soglia di INATTIVITA': chi lavora non viene mai
# interrotto, chi lascia la scheda aperta e va via viene disconnesso.
#
# Con un valore solo, come prima, si otteneva l'opposto: l'utente veniva
# buttato fuori dopo un'ora mentre lavorava, e non veniva buttato fuori mai
# per inattivita'.
#
# Il tetto e' tarato sul turno di chi guarda la flotta.
jwt:
  secret: ${JWT_SECRET}
  # LA PROMESSA: quanta inattivita' si tollera prima di chiedere di nuovo
  # l'accesso. E' questa la soglia che l'utente percepisce.
  idle-ms:         ${JWT_IDLE_MS:1800000}           # 30 min fermi -> fuori
  # LA VITA DEL TOKEN, che deve essere MAGGIORE della soglia qui sopra.
  #
  # Il rinnovo avviene quando al token resta meno di idle-ms, quindi con
  # expiration-ms == idle-ms la promessa non sarebbe mantenuta: una richiesta
  # fatta poco dopo l'emissione non rinnoverebbe niente, e da li' l'utente
  # avrebbe molto meno di mezz'ora prima di essere buttato fuori. Con
  # quarantacinque minuti la tolleranza reale sta fra 30 e 45: mai meno di
  # quanto promesso, e un rinnovo ogni quarto d'ora scarso di lavoro.
  expiration-ms:   ${JWT_EXPIRATION_MS:2700000}     # 45 min
  session-max-ms:  ${JWT_SESSION_MAX_MS:36000000}   # tetto: 10 h in tutto

# ── SSE API token    ──────────────────────────────────────────────
sse:
  api-token: ${SSE_API_TOKEN}

# ── OpenAPI / Swagger UI ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/swagger-ui
    operationsSorter: method
  info:
    title: CASSITRACK API
    description: Real-time bus fleet monitoring — Cassino MAGNI Autoservizi
    version: v1

# ── Spring Boot Actuator (expose only health + info) ──────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ── Logging ───────────────────────────────────────────────────────
logging:
  level:
    it.unicas.cassitrack: INFO
    SECURITY_AUDIT: INFO
    org.springframework.integration.mqtt: INFO
    org.hibernate.SQL: WARN
    org:
      springframework:
        security: WARN

# ── CORS ──────────────────────────────────────────────────────
# List the origins that browser-based apps are allowed to call CassiTrack from.
# Add any external website URL here if it needs to access CassiTrack's public APIs
# (e.g. GTFS-RT, SIRI, vehicle positions) directly from the browser.
cassitrack:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8280,http://localhost:8180}
  cookie:
    secure: ${COOKIE_SECURE:false}   # set to true when running behind Nginx+TLS
  csp:
    connect-extra: ${CSP_CONNECT_EXTRA:http://localhost:8180}   # extra origins for CSP connect-src

# ── Anthropic Claude API ──────────────────────────────────────
anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:no-key-set}
    url: https://api.anthropic.com/v1/messages
    model: ${ANTHROPIC_API_MODEL:claude-sonnet-4-20250514} # alternative models: claude-haiku-4-5-20251001, claude-3-5-haiku-latest
    version: ${ANTHROPIC_API_VERSION:2023-06-01}

# ── Weather Service (OpenWeatherMap) ─────────────────────────
# Get free key at: https://openweathermap.org/api
# Set as .env variable WEATHER_API_KEY in IntelliJ
# If not configured, defaults to CLEAR weather (safe fallback)
weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: https://api.openweathermap.org/data/2.5/weather
    city: Cassino
    country: IT
